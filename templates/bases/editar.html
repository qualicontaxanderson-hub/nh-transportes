{% extends "base.html" %}
{% block title %}Editar Base - {{ app_name }}{% endblock %}

{% block styles %}
<style>
/* O layout base pinta todo body > .container-fluid de branco com 2rem de
   padding; no celular vira moldura e a tela nao enche. */
body > .container-fluid:has(#bfi){
  background:transparent; box-shadow:none; border-radius:0;
  padding:.3rem .3rem 0; margin:0; max-width:none;
}
@media (min-width:992px){
  body > .container-fluid:has(#bfi){ padding:.7rem 1rem 0; }
}
#bfi.container-fluid{ padding-left:0; padding-right:0; }

#bfi .topo{ background:linear-gradient(120deg,#2E6FB0,#1D63A5 55%,#0C4C86);
  color:#fff; border-radius:14px; padding:.7rem .85rem; margin-bottom:.7rem;
  display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
#bfi .topo__t{ flex:1; min-width:0; }
#bfi .topo__n{ font-weight:800; font-size:1rem; line-height:1.3; }
#bfi .topo__s{ font-size:.75rem; opacity:.9; }
#bfi .bt-t{ border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.14); color:#fff; border-radius:9px;
  padding:.34rem .7rem; font-size:.77rem; font-weight:800; font-family:inherit;
  cursor:pointer; white-space:nowrap; text-decoration:none;
  display:inline-flex; gap:.3rem; align-items:center; }
#bfi .bt-t:hover{ background:rgba(255,255,255,.26); color:#fff; }
</style>

<style>
  .page-hero {
    background: linear-gradient(135deg, #1D63A5 0%, #1a4f82 60%, #154070 100%);
    border-radius: .75rem; padding: 1.5rem 2rem; margin-bottom: 1.5rem; color: #fff;
  }
  .page-hero .hero-icon {
    width: 3rem; height: 3rem; background: rgba(255,255,255,.15); border-radius: .6rem;
    display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0;
  }
  .form-section-title {
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: #1D63A5; border-left: 3px solid #1D63A5; padding-left: 0.5rem; margin: 1rem 0 0.6rem;
  }
  .form-label { font-size: 0.83rem; font-weight: 600; color: #374151; }
  .form-control-sm, .form-select-sm { font-size: 0.84rem; }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid" id="bfi">
  <div class="topo">
    <div class="topo__t">
      <div class="topo__n">{{ base.nome }}</div>
      <div class="topo__s">base #{{ base.id }} · editando</div>
    </div>
    
    <a class="bt-t" href="{{ url_for('bases.lista') }}">
      <i class="bi bi-arrow-left"></i> Voltar</a>
  </div>
  <div class="card shadow-sm">
    <div class="card-header d-flex align-items-center py-2"
         style="background:#1D63A5;color:white;font-size:0.82rem;font-weight:600;letter-spacing:0.02em;">
      <i class="bi bi-geo-alt-fill me-2"></i> Dados da Base
    </div>
    <div class="card-body">
      <form method="POST">
        <div class="form-section-title"><i class="bi bi-info-circle me-1"></i>Dados Principais</div>
        <div class="row">
          <div class="col-md-6 mb-2">
            <label class="form-label">Nome da Base <span class="text-danger">*</span></label>
            <input type="text" name="nome" class="form-control form-control-sm"
                   value="{{ base.nome }}" required>
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">Cidade</label>
            <input type="text" name="cidade" class="form-control form-control-sm"
                   value="{{ base.cidade or '' }}">
          </div>
        </div>
        <div class="row">
          <div class="col-md-12 mb-2">
            <label class="form-label">Observação</label>
            <input type="text" name="observacao" class="form-control form-control-sm"
                   value="{{ base.observacao or '' }}">
          </div>
        </div>
        <div class="row">
          <div class="col-md-12 mb-2">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="ativo" name="ativo"
                     {% if base.ativo %}checked{% endif %}>
              <label class="form-check-label" for="ativo" style="font-size:0.83rem;font-weight:600;color:#374151;">
                Base ativa
              </label>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between mt-4 pt-2 border-top">
          <a href="{{ url_for('bases.lista') }}" class="btn btn-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Voltar
          </a>
          <button type="submit" class="btn btn-primary btn-sm px-4">
            <i class="bi bi-check-circle me-1"></i> Salvar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
